<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>

    <!-- MathJax v3 — renders $$...$$, \[...\], \(...\) and $...$ but ignores code blocks -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)'], ['$', '$']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; color: #24292e; max-width: 900px; margin: 0 auto; padding: 1.5rem; }
      h1, h2, h3 { margin-top: 2rem; border-bottom: 1px solid #eaecef; padding-bottom: .3rem; }
      nav { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 6px; padding: .75rem 1rem; margin-bottom: 2rem; }
      nav a { margin-right: 1rem; text-decoration: none; color: #0366d6; }
      nav a:hover { text-decoration: underline; }
      code { background: #f6f8fa; border-radius: 3px; padding: .2em .4em; font-size: 85%; }
      pre code { background: none; padding: 0; }
      pre { background: #f6f8fa; border-radius: 6px; padding: 1rem; overflow-x: auto; }
      blockquote { color: #6a737d; border-left: .25em solid #dfe2e5; padding: 0 1em; margin: 0; }
      .page-nav { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #eaecef; display: flex; gap: 1rem; }
    </style>
  </head>
  <body>
    <nav>
      <a href="{{ '/' | relative_url }}">🏠 Accueil</a>
      <a href="{{ '/overview' | relative_url }}">Vue d'ensemble</a>
      <a href="{{ '/theorie' | relative_url }}">Théorie</a>
      <a href="{{ '/pipeline-scripts' | relative_url }}">Pipeline MATLAB</a>
      <a href="{{ '/annexes' | relative_url }}">Annexes</a>
    </nav>

    <main>
      {{ content }}
    </main>
  </body>
</html>
